name = "cold-breeze-bb3e"
main = "worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./assets"

[triggers]
crons = ["0 2 * * *"]

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "threadcontrol-backups"

[env.staging]
name = "stagingthread"
[env.staging.vars]
FIREBASE_URL = "https://stagingthread-default-rtdb.firebaseio.com"

[env.staging.assets]
directory = "./assets"

[env.staging.triggers]
crons = ["0 2 * * *"]
